<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mango Stok Hataları</title>
    <style>
        /* GENEL AYARLAR */
        body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background-color: #f4f7f6; color: #333; }
        
        /* HEADER - MOBİL UYUMLU */
        header { 
            background-color: #fff; 
            padding: 10px 15px; 
            border-bottom: 1px solid #ddd; 
            display: flex; 
            flex-direction: column; /* Mobilde alt alta */
            align-items: center; 
            text-align: center;
        }

        .logo { 
            font-weight: 800; 
            font-size: 20px; 
            color: #0056b3; 
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .project-name { 
            font-size: 14px; 
            color: #444; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Bilgisayar ekranı için header ayarı */
        @media (min-width: 768px) {
            header { flex-direction: row; justify-content: space-between; height: 50px; padding: 15px 30px; }
            .project-name { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 18px; }
            .logo { font-size: 24px; margin-bottom: 0; }
        }

        /* MENÜ ALANI - SCROLL EDİLEBİLİR */
        #menu-wrapper {
            background-color: #fff;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-wrap: nowrap; /* Mobilde yan yana kalsın, taşarsa kaydırılsın */
            overflow-x: auto; /* Yatay kaydırma */
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* Bilgisayarda butonlar yayılsın */
        @media (min-width: 768px) {
            #menu-wrapper { flex-wrap: wrap; justify-content: center; overflow-x: visible; }
        }

        /* BUTON TASARIMI */
        .koridor-btn {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            white-space: nowrap; /* Yazı alt satıra geçmesin */
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .koridor-btn.active { background-color: #0056b3; color: #fff; border-color: #004494; }
        .koridor-btn.empty { opacity: 0.6; }

        .badge { background-color: #e9ecef; color: #333; font-size: 10px; padding: 2px 6px; border-radius: 8px; }
        .koridor-btn.active .badge { background-color: rgba(255,255,255,0.2); color: #fff; }

        /* GALERİ VE MESAJ ALANI */
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .gallery-grid { 
            width: 100%;
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* Mobilde yan yana 2 tane */
            gap: 10px; 
            padding-bottom: 50px; 
        }

        /* Bilgisayarda yan yana daha fazla */
        @media (min-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        }

        /* RESİM KARTLARI */
        .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .card img { width: 100%; height: 150px; object-fit: cover; display: block; }
        
        @media (min-width: 768px) { .card img { height: 200px; } }

        .card-info { padding: 8px; text-align: center; font-size: 11px; color: #666; background: #fafafa; }

        /* BİLGİ MESAJI */
        .info-msg { 
            text-align: center; font-size: 16px; color: #777; margin: 30px auto; padding: 20px; 
            background: #fff; border-radius: 12px; border: 1px dashed #ccc; width: 90%; max-width: 600px; 
        }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); justify-content: center; align-items: center; }
        .modal img { max-width: 98%; max-height: 90%; object-fit: contain; }
        .close { position: absolute; top: 15px; right: 20px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">ARVATO</div>
        <div class="project-name">MANGO STOK HATALARI</div>
    </header>

    <div id="menu-wrapper"></div>

    <div class="container">
        <div id="gallery-area" style="width: 100%;">
            <div class="info-msg">👆 İncelemek istediğiniz koridoru seçin.</div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="this.style.display='none'">
        <span class="close">&times;</span>
        <img id="img01">
    </div>

    <script src="veritabani.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const veri = (typeof galeriVerisi !== 'undefined' && galeriVerisi) ? galeriVerisi : {};
            const menuWrapper = document.getElementById("menu-wrapper");
            const galleryArea = document.getElementById("gallery-area");
            
            menuWrapper.innerHTML = ""; 

            for (let i = 1; i <= 18; i++) {
                let numStr = i.toString().padStart(3, '0');
                let folderName = `F2_${numStr}`;
                let displayName = `F2 ${numStr}`;
                let images = veri[folderName] || [];
                let count = images.length;

                const btn = document.createElement("button");
                btn.className = "koridor-btn";
                if (count === 0) btn.classList.add("empty");
                btn.innerHTML = `${displayName} <span class="badge">${count}</span>`;
                
                btn.onclick = function() {
                    document.querySelectorAll('.koridor-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    galleryArea.innerHTML = "";

                    if (count === 0) {
                        galleryArea.innerHTML = `<div class="info-msg">📂 <b>${displayName}</b> koridorunda hata görseli yok.</div>`;
                        return;
                    }

                    const grid = document.createElement("div");
                    grid.className = "gallery-grid";

                    images.forEach(imgSrc => {
                        const card = document.createElement("div");
                        card.className = "card";
                        const fileName = imgSrc.split('/').pop();
                        card.innerHTML = `<img src="${imgSrc}" onclick="openModal('${imgSrc}'); event.stopPropagation();" loading="lazy"><div class="card-info">${fileName}</div>`;
                        card.onclick = function() { openModal(imgSrc); };
                        grid.appendChild(card);
                    });
                    galleryArea.appendChild(grid);
                };
                menuWrapper.appendChild(btn);
            }
        });

        function openModal(src) {
            const modal = document.getElementById("myModal");
            const modalImg = document.getElementById("img01");
            modal.style.display = "flex";
            modalImg.src = src;
        }
    </script>
</body>
</html>
